<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" role="img" aria-label="Chronological age calculator showing exact age in years, months, and days">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f5f3ff"/>
      <stop offset="1" stop-color="#eef2ff"/>
    </linearGradient>
    <linearGradient id="teal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7c3aed"/>
      <stop offset="1" stop-color="#4f46e5"/>
    </linearGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
  </defs>
  <rect width="800" height="450" rx="24" fill="url(#bg)"/>
  <!-- Calendar (birth date) -->
  <g filter="url(#sh)">
    <rect x="70" y="120" width="200" height="180" rx="16" fill="#fff" stroke="#e2e8f0"/>
    <rect x="70" y="120" width="200" height="44" rx="16" fill="url(#teal)"/>
    <rect x="70" y="150" width="200" height="14" fill="url(#teal)"/>
    <text x="170" y="150" text-anchor="middle" font-family="Arial" font-size="18" font-weight="700" fill="#fff">Date of Birth</text>
    <circle cx="170" cy="230" r="34" fill="#f5f3ff" stroke="#7c3aed" stroke-width="3"/>
    <text x="170" y="240" text-anchor="middle" font-family="Arial" font-size="30" font-weight="800" fill="#6d28d9">12</text>
  </g>
  <!-- Arrow -->
  <path d="M285 210 H360" stroke="#94a3b8" stroke-width="5" stroke-linecap="round"/>
  <path d="M352 198 L372 210 L352 222 Z" fill="#94a3b8"/>
  <!-- Result card -->
  <g filter="url(#sh)">
    <rect x="400" y="100" width="320" height="220" rx="18" fill="#fff" stroke="#e2e8f0"/>
    <text x="424" y="140" font-family="Arial" font-size="15" font-weight="700" fill="#64748b">CHRONOLOGICAL AGE</text>
    <text x="424" y="184" font-family="Arial" font-size="34" font-weight="800" fill="#6d28d9">11y 6m 21d</text>
    <rect x="424" y="210" width="84" height="64" rx="10" fill="#f1f5f9"/>
    <rect x="518" y="210" width="84" height="64" rx="10" fill="#f1f5f9"/>
    <rect x="612" y="210" width="84" height="64" rx="10" fill="#f1f5f9"/>
    <text x="466" y="242" text-anchor="middle" font-family="Arial" font-size="18" font-weight="800" fill="#0f172a">138</text>
    <text x="466" y="262" text-anchor="middle" font-family="Arial" font-size="10" fill="#64748b">MONTHS</text>
    <text x="560" y="242" text-anchor="middle" font-family="Arial" font-size="18" font-weight="800" fill="#0f172a">600</text>
    <text x="560" y="262" text-anchor="middle" font-family="Arial" font-size="10" fill="#64748b">WEEKS</text>
    <text x="654" y="242" text-anchor="middle" font-family="Arial" font-size="18" font-weight="800" fill="#0f172a">4204</text>
    <text x="654" y="262" text-anchor="middle" font-family="Arial" font-size="10" fill="#64748b">DAYS</text>
  </g>
  <text x="400" y="385" text-anchor="middle" font-family="Arial" font-size="16" fill="#64748b">Exact age in years, months &amp; days  instantly</text>
</svg>
