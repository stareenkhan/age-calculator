<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" role="img" aria-label="Chronological age calculator for testing showing age in years and months for SLP assessments">
  <rect width="800" height="420" rx="20" fill="#f8fafc"/>
  <text x="400" y="50" text-anchor="middle" font-family="Arial" font-size="22" font-weight="800" fill="#0f172a">Chronological Age for Testing</text>
  <g font-family="Arial" filter="">
    <rect x="90" y="90" width="240" height="270" rx="14" fill="#fff" stroke="#e2e8f0"/>
    <text x="210" y="125" text-anchor="middle" font-size="15" font-weight="700" fill="#64748b">Score Sheet</text>
    <line x1="120" y1="150" x2="300" y2="150" stroke="#e2e8f0" stroke-width="2"/>
    <line x1="120" y1="180" x2="300" y2="180" stroke="#e2e8f0" stroke-width="2"/>
    <line x1="120" y1="210" x2="300" y2="210" stroke="#e2e8f0" stroke-width="2"/>
    <line x1="120" y1="240" x2="260" y2="240" stroke="#e2e8f0" stroke-width="2"/>
    <rect x="120" y="280" width="180" height="50" rx="8" fill="#f5f3ff" stroke="#7c3aed"/>
    <text x="210" y="312" text-anchor="middle" font-size="20" font-weight="800" fill="#6d28d9">Age 5;7</text>
  </g>
  <g font-family="Arial">
    <rect x="380" y="90" width="330" height="120" rx="14" fill="#fff" stroke="#e2e8f0"/>
    <text x="410" y="125" font-size="14" fill="#64748b">Test administration date</text>
    <text x="410" y="165" font-size="26" font-weight="800" fill="#4f46e5">Jun 3, 2026</text>
    <rect x="380" y="230" width="330" height="130" rx="14" fill="#fff" stroke="#e2e8f0"/>
    <text x="410" y="262" font-size="14" font-weight="700" fill="#64748b">Used with</text>
    <text x="410" y="292" font-size="15" fill="#0f172a">WISC · WAIS · Brigance</text>
    <text x="410" y="320" font-size="15" fill="#0f172a">ASQ · ESI · Gesell · PAR</text>
  </g>
</svg>
